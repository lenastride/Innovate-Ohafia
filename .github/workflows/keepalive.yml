name: Keep Supabase awake

on:
  schedule:
    - cron: '17 0,8,16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        env:
          KEEPALIVE_URL: ${{ secrets.KEEPALIVE_URL }}
          KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
        run: |
          if [ -z "$KEEPALIVE_URL" ] || [ -z "$KEEPALIVE_TOKEN" ]; then
            echo "KEEPALIVE_URL and KEEPALIVE_TOKEN secrets are required."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${KEEPALIVE_TOKEN}" \
            "${KEEPALIVE_URL}"
